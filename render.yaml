# Render Blueprint configuration for Excalidraw Full-Stack
services:
  # 1. Spring Boot Backend Service
  - type: web
    name: whiteboard-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: whiteboard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # 2. React + Nginx Frontend Service
  - type: web
    name: whiteboard-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    region: oregon

databases:
  # PostgreSQL Database
  - name: whiteboard-db
    databaseName: excalidraw
    user: excalidraw
    plan: free
    region: oregon
