databases:
  - name: whiteboard-db
    databaseName: whiteboard
    user: whiteboard_user
    plan: free
    region: oregon

services:
  - type: web
    name: whiteboard
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx384m -Xms256m"
      - key: DB_HOST
        fromDatabase:
          name: whiteboard-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: whiteboard-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: whiteboard-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: whiteboard-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: whiteboard-db
          property: password
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
