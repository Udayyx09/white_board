# Render Blueprint configuration for Excalidraw Full-Stack
services:
  # All-in-One Full-Stack Web Service (Spring Boot 3 + React 19 + WebSocket)
  - type: web
    name: whiteboard
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: whiteboard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  # Managed PostgreSQL Database
  - name: whiteboard-db
    databaseName: excalidraw
    user: excalidraw
    plan: free
    region: oregon
